# Automatische Prüfungen: Build und alle Tests unter Windows und Linux (inkl. ffmpeg- und SkiaSharp-Integration),
# bei Push auf master bzw. manuell zusätzlich die Installationspakete (setup.exe, linux-x64.tar.gz) als Artefakt.
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
  # Aufruf aus release.yml: dort ist das Ereignis ein Push (des Tags), daher entstehen auch die Pakete
  workflow_call:

# Ein neuer Push in denselben Pull Request bricht den alten Lauf ab; Läufe auf master laufen immer zu Ende.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  test:
    name: Build und Tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: ubuntu-latest
            name: Linux
    env:
      # ffmpeg- und SkiaSharp-Tests dürfen hier nicht still übersprungen werden (siehe IntegrationRequirement)
      STUDYSCOPE_REQUIRE_INTEGRATION: "1"
      # ffmpeg für Windows (Gyan-Build aus GitHub-Releases); beim Anheben Version und SHA-256 zusammen ändern
      FFMPEG_WINDOWS_VERSION: "9.0.2"
      FFMPEG_WINDOWS_SHA256: "4705843ccaaf54257c16ad90f3e952ece33c17df964ecf7bfdbb0f49c7171077"
    steps:
      - name: Quellcode holen
        uses: actions/checkout@v7

      - name: .NET 10 einrichten
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: NuGet-Cache
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      # Linux: Build und Tests brauchen weder WebKitGTK noch GTK oder libnotify (die Tests binden kein Photino ein);
      # SkiaSharp braucht fontconfig und mindestens eine Schrift, die ffmpeg-Integrationstests ffmpeg/ffprobe.
      - name: ffmpeg und Schriften installieren (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg fontconfig fonts-dejavu-core
          ffmpeg -hide_banner -version | head -n 1
          fc-list | wc -l

      # Windows: fest versionierter Gyan-Build (essentials: libx264, AAC, libmp3lame, ffprobe) aus GitHub-Releases,
      # mit SHA-256-Prüfung und Cache. Chocolatey nur als Rückfall – dessen Server lieferte schon 504 (Gateway Timeout).
      - name: ffmpeg-Cache (Windows)
        if: runner.os == 'Windows'
        id: ffmpeg-cache
        uses: actions/cache@v6
        with:
          path: C:\ffmpeg-ci
          key: ffmpeg-windows-${{ env.FFMPEG_WINDOWS_VERSION }}-essentials

      - name: ffmpeg installieren (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target = "C:\ffmpeg-ci"
          $exe = Join-Path $target "bin\ffmpeg.exe"
          if (-not (Test-Path $exe)) {
            $name = "ffmpeg-$env:FFMPEG_WINDOWS_VERSION-essentials_build"
            $url = "https://github.com/GyanD/codexffmpeg/releases/download/$env:FFMPEG_WINDOWS_VERSION/$name.7z"
            $archive = Join-Path $env:RUNNER_TEMP "$name.7z"
            try {
              Invoke-WebRequest $url -OutFile $archive -MaximumRetryCount 3 -RetryIntervalSec 15
              $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($hash -ne $env:FFMPEG_WINDOWS_SHA256) { throw "Prüfsumme von $name.7z stimmt nicht ($hash)." }
              7z x $archive "-o$env:RUNNER_TEMP" -y | Out-Null
              if ($LASTEXITCODE -ne 0) { throw "Entpacken von $name.7z fehlgeschlagen." }
              New-Item -ItemType Directory -Force $target | Out-Null
              Move-Item (Join-Path $env:RUNNER_TEMP "$name\bin") (Join-Path $target "bin")
            }
            catch {
              Write-Output "::warning::ffmpeg aus GitHub-Releases nicht verfügbar ($_) – Rückfall auf Chocolatey."
              choco install ffmpeg -y --no-progress
              if ($LASTEXITCODE -ne 0) { throw "ffmpeg konnte weder aus GitHub-Releases noch über Chocolatey installiert werden." }
            }
          }
          if (Test-Path $exe) { Add-Content -LiteralPath $env:GITHUB_PATH -Value (Split-Path $exe) ; $env:PATH = "$(Split-Path $exe);$env:PATH" }
          ffmpeg -hide_banner -version | Select-Object -First 1
          Get-Command ffmpeg, ffprobe | Format-Table Name, Source
          $encoders = (ffmpeg -hide_banner -encoders) -join "`n"
          foreach ($enc in "libx264", "aac", "libmp3lame") { if ($encoders -notmatch "\b$enc\b") { throw "ffmpeg ohne Encoder $enc." } }

      - name: Pakete wiederherstellen
        run: dotnet restore StudyScope.slnx

      # Warnungen erscheinen als Hinweise im Lauf (Problem-Matcher von setup-dotnet), brechen den Build aber nicht ab
      - name: Build (Release)
        run: dotnet build StudyScope.slnx -c Release --no-restore

      - name: Tests
        run: >
          dotnet test StudyScope.Tests -c Release --no-build
          --logger "trx;LogFileName=tests-${{ matrix.name }}.trx"
          --logger "console;verbosity=normal"
          --results-directory TestResults
          --blame-hang-timeout 10m

      # Zweiter Lauf mit deutscher Formatkultur (Dezimalkomma): Die Runner prüfen sonst nur en-US bzw. die invariante
      # Kultur. Ein Lauf genügt (Linux); Oberflächensprache bleibt in beiden Läufen Deutsch (TestCulture.cs).
      - name: Tests (Formatkultur de-DE)
        if: ${{ matrix.name == 'Linux' }}
        env:
          STUDYSCOPE_TEST_CULTURE: de-DE
        run: >
          dotnet test StudyScope.Tests -c Release --no-build
          --logger "trx;LogFileName=tests-${{ matrix.name }}-de-DE.trx"
          --results-directory TestResults
          --blame-hang-timeout 10m

      - name: Testzusammenfassung
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./.github/scripts/test-summary.ps1 -ResultsDirectory TestResults -Title "Tests (${{ matrix.name }})"

      - name: Testergebnisse hochladen
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: testergebnisse-${{ matrix.name }}
          path: TestResults/
          retention-days: 14
          if-no-files-found: warn

  packages:
    name: Installationspaket
    # Nicht bei jedem Pull Request – nur nach dem Merge auf master, auf Knopfdruck, beim Release (Tag) und in
    # Pull Requests von release/*-Branches (damit die Pakete vor dem Tag einmal echt gebaut werden)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/')
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: ubuntu-latest
            name: Linux
    steps:
      - name: Quellcode holen
        uses: actions/checkout@v7

      # Ausgabe außerhalb des Repositorys: die Build-Skripte schreiben dann nichts nach artifacts/
      - name: Ausgabeordner festlegen
        shell: pwsh
        run: Add-Content -LiteralPath $env:GITHUB_ENV -Value "STUDYSCOPE_ARTIFACTS_DIR=$(Join-Path $env:RUNNER_TEMP 'studyscope-pakete')"

      - name: .NET 10 einrichten
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: NuGet-Cache
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: setup.exe bauen
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build/build-setup.ps1 -Runtime win-x64

      - name: linux-x64.tar.gz bauen
        if: runner.os == 'Linux'
        run: ./build/build-setup.sh linux-x64

      - name: Größe und Prüfsumme
        shell: pwsh
        run: |
          $files = Get-ChildItem "$env:STUDYSCOPE_ARTIFACTS_DIR" -File -Filter "StudyScope-*"
          if (-not $files) { throw "Kein Installationspaket gefunden." }
          $out = @("## Installationspaket (${{ matrix.name }})", "", "| Datei | Größe | SHA-256 |", "|---|---|---|")
          foreach ($f in $files) {
            $hash = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $out += "| $($f.Name) | $('{0:N1}' -f ($f.Length / 1MB)) MB ($($f.Length) Byte) | ``$hash`` |"
          }
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ($out -join "`n") -Encoding UTF8

      - name: Paket hochladen
        uses: actions/upload-artifact@v7
        with:
          name: installationspaket-${{ matrix.name }}
          path: ${{ env.STUDYSCOPE_ARTIFACTS_DIR }}/StudyScope-*
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
